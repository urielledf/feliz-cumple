<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Cumpleaños</title>
    <style>
        body {
            text-align: center;
            background-color: rgb(132, 1, 255);
            font-family: Arial, sans-serif;
            margin: 0;
        }

        #contenedor {
            display: none; /* Se oculta hasta que la persona elija "Sí" */
        }

        /* Estilos para las imágenes decorativas en los márgenes */
        .margen {
            position: fixed;
            top: 0;
            bottom: 0;
            width: 20%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
        }

        .izquierda {
            left: 0;
        }

        .derecha {
            right: 0;
        }

        .decoracion {
            width: 80%;
            height: auto;
        }

        /* Imagen central */
        #imagen {
            width: 400px;
            height: 800px;
            display: block;
            margin: auto;
        }
    </style>
</head>
<body>
    <h1>Feliz Cumpleaños, Nadia!</h1>
    
    <!-- Pantalla de inicio -->
    <div id="inicio">
        <h2>¿Estás lista para comenzar?</h2>
        <button onclick="iniciar()">Sí</button>
    </div>

    <!-- Contenido oculto hasta que se inicie -->
    <div id="contenedor">
        <p id="frase">Gracias por tantos años de amistad.</p>
        <img id="imagen" src="imagen1.jpeg" alt="Imagen de cumpleaños">
        <br>
        <button onclick="cambiarImagen()">Siguiente Imagen</button>

        <!-- Música -->
        <audio id="audio" autoplay>
            <source id="source" src="cancion1.mp3" type="audio/mpeg">
            Tu navegador no soporta el audio.
        </audio>

        <!-- Imágenes decorativas en los márgenes -->
        <div class="margen izquierda">
            <img src="sonic-shadow.jpg" class="decoracion">
            <img src="gambito-rogue.jpg" class="decoracion">
            <img src="starfire-nightwing.jpg" class="decoracion">
        </div>

        <div class="margen derecha">
            <img src="nana-ren.jpg" class="decoracion">
            <img src="imagen-extra1.jpg" class="decoracion">
            <img src="imagen-extra2.jpg" class="decoracion">
        </div>
    </div>

    <script>
        // Lista de imágenes y frases
        let imagenes = [
            "imagen1.jpeg", "imagen2.jpeg", "imagen3.jpeg",
            "imagen4.jpeg", "imagen5.jpeg", "imagen6.jpeg", "imagen7.jpeg"
        ];
        let frases = [
            "Gracias por todo.", "Eres la mejor amiga que alguien como yo puede tener.",
            "Siempre estaré para vos.", "Espero que sigamos así mucho tiempo más.",
            "Ya no sé qué más decir", "Pisssss", "Gotta Go Fast"
        ];
        let index = 0;

        // Lista de canciones (ahora con 9)
        let canciones = [
            "cancion1.mp3", "cancion2.mp3", "cancion3.mp3",
            "cancion4.mp3", "cancion5.mp3", "cancion6.mp3"
        ];
        let indiceCancion = 0;
        let audio = document.getElementById("audio");
        let source = document.getElementById("source");

        // Función para cambiar imágenes y frases
        function cambiarImagen() {
            index = (index + 1) % imagenes.length;
            document.getElementById("imagen").src = imagenes[index];
            document.getElementById("frase").innerText = frases[index];
        }

        // Cambiar imagen automáticamente cada 5 segundos
        setInterval(cambiarImagen, 5000);

        // Cambiar canción cuando termine la actual
        audio.onended = function() {
            indiceCancion = (indiceCancion + 1) % canciones.length;
            source.src = canciones[indiceCancion];
            audio.load();
            audio.play();
        };

        // Función para iniciar la página después de elegir "Sí"
        function iniciar() {
            document.getElementById("inicio").style.display = "none";
            document.getElementById("contenedor").style.display = "block";
            audio.play();
        }
    </script>

</body>
</html>
